name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Docker is preinstalled, so Testcontainers can start SQL Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore PermitsApi.slnx
      - run: dotnet build PermitsApi.slnx -c Release --no-restore
      - run: dotnet test PermitsApi.slnx -c Release --no-build --logger "console;verbosity=normal"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t permits-spatial-api .
