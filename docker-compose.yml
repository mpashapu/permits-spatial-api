# Local stack: SQL Server 2022 + the API.
#   docker compose up -d
#   docker compose run --rm api import --sample data/sample-permits.json
#   open http://localhost:8080/scalar
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Local development only. Override with a .env file; never reuse in a real environment.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Local_Dev_Only_Pa55!}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Permits: "Server=sqlserver,1433;Database=Permits;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Only_Pa55!};TrustServerCertificate=True"
      Database__InitializeSchemaOnStartup: "true"
      Import__LayerUrl: ${PERMITS_LAYER_URL:-}
    ports:
      - "8080:8080"
